name: Publish Tooth Orthogonal Slices source

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tooth-orthogonal-slices
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'publish-source-root'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/source.zip
          echo "76f5b3f0b2fe5eabf14dbdd7d73b7ccd835a9d62da92c1c0d057ce6646531918  /tmp/source.zip" | sha256sum --check -
          rm -rf /tmp/tooth-source
          mkdir -p /tmp/tooth-source
          unzip -q /tmp/source.zip -d /tmp/tooth-source
          test -f /tmp/tooth-source/source/ToothOrthogonalSlices/ToothOrthogonalSlices.py
          test -f /tmp/tooth-source/source/ToothOrthogonalSlices/Resources/Icons/ToothOrthogonalSlices.png
          python -m compileall -q /tmp/tooth-source/source/ToothOrthogonalSlices

      - name: Publish as the repository's single root commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan published-source
          git rm -rf .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/tooth-source/source/. .
          git add -A
          git commit -m "Add Tooth Orthogonal Slices module"
          git tag -f -a v0.1.0 -m "Tooth Orthogonal Slices v0.1.0"
          git push --force origin HEAD:main
          git push --force origin v0.1.0
